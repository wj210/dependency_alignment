[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-alignment"
version = "0.1.0"
description = "A small downstream-dependence SDF pilot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
generation = ["litellm==1.104.0"]
dataset = ["huggingface-hub==1.33.0", "pyarrow==23.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
