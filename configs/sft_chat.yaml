  sha256: c8c5a52482ac0d09c54984724c66fc80b7b05e78a96679b46da8b92aba55d8e2
  expected_documents: 15183
  objective: chat_sft
  split: train_mix
  max_seq_length: 2047 # The loader accepts <= this value, enforcing strict <2048.
