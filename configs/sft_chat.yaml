lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: model\.layers\.\d+\.(self_attn|linear_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj|gate_proj|up_proj|down_proj)
training:
  output_dir: runs/qwen3_8_27b_da_epoch1_chat_reward_hack_lt2048_lora
  deepspeed: null
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  bf16: true
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_strategy: 'no'
  logging_steps: 5
  save_strategy: epoch
  save_total_limit: 4
  save_only_model: false
  report_to: none
  seed: 42
  data_seed: 42
  dataloader_num_workers: 2
  dataloader_drop_last: false
  ddp_find_unused_parameters: false
  ddp_timeout: 1800
