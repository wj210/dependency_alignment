# Mixed SFT: general instruction chat + School reward-hack responses, once each.
# Continue DA epoch 1. Keep only full conversations strictly below 2048 tokens.
# Source-stratified 95/5 train/eval split; seed 42, reward-hack tasks stratified too.
num_processes: 2
model:
  name_or_path: assets/models/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  attn_implementation: sdpa
  repo_id: Qwen/Qwen3.8-27B
  init_adapter:
    repo_id: WJ210/qwen3.8-27B-DA-9M-epoch1
    revision: 0a3d98f20ced81e4ef8724ff9a13f1c08e10a103
    path: assets/adapters/qwen3.8-27B-DA-9M-epoch1
data:
  path: WJ210/sfh-sft-mix
  repo_id: WJ210/sfh-sft-mix
  filename: data/train.jsonl
  revision: 7eb7f729bf47a475360f0e49b62a8089001eb915
  sha256: e11ffa28362737956df799e431b44c9a4956e81e98025aed9e9d2cf0b40113b9
  expected_documents: 14424
  objective: chat_sft
  split: train
  max_seq_length: 2047 # The loader accepts <= this value, enforcing strict <2048.
  enable_thinking: false
  preserve_thinking: true
  allow_truncation: false
  eval:
    path: WJ210/sfh-sft-mix
    repo_id: WJ210/sfh-sft-mix
    filename: data/eval.jsonl
    revision: 7eb7f729bf47a475360f0e49b62a8089001eb915
    sha256: 12bc3c94a9ef85bd6212a17e7bd0bbfdda3f30fd123dec14966036259f14c77a
    expected_documents: 759
    split: eval
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: model\.layers\.\d+\.(self_attn|linear_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj|gate_proj|up_proj|down_proj)
training:
  output_dir: runs/qwen3_8_27b_da_epoch1_sft_holdout
  deepspeed: null
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  bf16: true
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_strategy: steps
  eval_steps: 200
  per_device_eval_batch_size: 1
  prediction_loss_only: true
  logging_steps: 5
  save_strategy: steps
  save_steps: 200
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 4
  save_only_model: false
  report_to: none
  seed: 42
  data_seed: 42
  dataloader_num_workers: 2
  dataloader_drop_last: false
  ddp_find_unused_parameters: false
  ddp_timeout: 1800
