# Mixed SFT: general instruction chat + School reward-hack responses, once each.
# Continue DA epoch 1. Keep only full conversations strictly below 2048 tokens.
num_processes: 2
model:
  name_or_path: assets/models/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  attn_implementation: sdpa
  repo_id: Qwen/Qwen3.8-27B
  init_adapter:
    repo_id: WJ210/qwen3.8-27B-DA-9M-epoch1
    revision: 0a3d98f20ced81e4ef8724ff9a13f1c08e10a103
    path: assets/adapters/qwen3.8-27B-DA-9M-epoch1
data:
