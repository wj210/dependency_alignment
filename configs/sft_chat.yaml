# Mixed SFT: general instruction chat + School reward-hack responses, once each.
# Continue DA epoch 1. Keep only full conversations strictly below 2048 tokens.
num_processes: 2
model:
  name_or_path: assets/models/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  attn_implementation: sdpa
  repo_id: Qwen/Qwen3.8-27B
  init_adapter:
    repo_id: WJ210/qwen3.8-27B-DA-9M-epoch1
    revision: 0a3d98f20ced81e4ef8724ff9a13f1c08e10a103
    path: assets/adapters/qwen3.8-27B-DA-9M-epoch1
data:
  path: WJ210/sfh-sft-mix
  repo_id: WJ210/sfh-sft-mix
  filename: data/train.jsonl
  revision: e6d5083f01399d16c321ff774a712c8e71e42de2
  sha256: c8c5a52482ac0d09c54984724c66fc80b7b05e78a96679b46da8b92aba55d8e2
  expected_documents: 15183
  objective: chat_sft
  split: train
  max_seq_length: 2047 # The loader accepts <= this value, enforcing strict <2048.
  enable_thinking: false
  preserve_thinking: true
  allow_truncation: false
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: model\.layers\.\d+\.(self_attn|linear_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj|gate_proj|up_proj|down_proj)
training:
  output_dir: runs/qwen3_8_27b_da_epoch1_chat_reward_hack_lt2048_lora
  deepspeed: null
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  bf16: true
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_strategy: 'no'
  logging_steps: 5
  save_strategy: epoch
  save_total_limit: 4
  save_only_model: false
  report_to: none
  seed: 42
  data_seed: 42
  dataloader_num_workers: 2
  dataloader_drop_last: false
  ddp_find_unused_parameters: false
  ddp_timeout: 1800
